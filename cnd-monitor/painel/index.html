<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23f2eee5'/><text y='23' x='16' text-anchor='middle' font-family='Futura,Avenir Next,sans-serif' font-size='17' font-weight='600' fill='%230a0a0a'>A</text></svg>">

<body>

<div class="timbre">

    <div class="marca">

</div>

<div class="folha">
  <div class="titulo-pagina">
    <hr class="fio fio--curto">
    <h1>Certidões da carteira</h1>
    <p class="sub" id="linha-fina">Carregando…</p>
  </div>

  <div class="comando">
    <span class="comando__rotulo">Consulta</span>
    <select id="provedor" title="Origem dos dados desta rodada"></select>
    <button class="principal" id="rodar">Consultar agora</button>
    <button id="parar" hidden>Interromper</button>

  <div class="abas" role="tablist">
    <button class="aba" role="tab" data-painel="avulsa" aria-selected="true">Consulta rápida</button>
    <button class="aba" role="tab" data-painel="situacao" aria-selected="false">Situação</button>
    <button class="aba" role="tab" data-painel="clientes" aria-selected="false">Clientes</button>
    <button class="aba" role="tab" data-painel="certificados" aria-selected="false">Certificados</button>
    <button class="aba" role="tab" data-painel="competencias" aria-selected="false">Competências</button>
  </div>

  <section id="painel-avulsa"></section>
  <section id="painel-situacao" hidden></section>
  <section id="painel-clientes" hidden></section>
  <section id="painel-certificados" hidden></section>
  <section id="painel-competencias" hidden></section>
</div>

<footer class="rodape">
  <div class="folha rodape__interno">
    <p>Roda inteiramente nesta máquina. Nenhum dado de cliente e nenhum certificado
       digital sai daqui.</p>
    <span class="assinatura">abcincembralot.com.br</span>
  </div>
</footer>

<script type="module">
const TOKEN = '__TOKEN_DO_PAINEL__';

// ---------------------------------------------------------------------------
// Validação de documento — mesma regra do src/documentos.js, reescrita aqui
// porque o painel é uma página estática sem etapa de build. Se um dia divergir,
// o cadastro aceitaria o que a rotina rejeita: o teste do painel compara as duas.
// ---------------------------------------------------------------------------
const PESOS_CPF_1 = [10,9,8,7,6,5,4,3,2];
const PESOS_CPF_2 = [11,10,9,8,7,6,5,4,3,2];
const PESOS_CNPJ_1 = [5,4,3,2,9,8,7,6,5,4,3,2];
const PESOS_CNPJ_2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];

const limpar = (v) => String(v ?? '').toUpperCase().replace(/[^0-9A-Z]/g, '');

function tipoDocumento(v) {
  const b = limpar(v);
  if (/^\d{11}$/.test(b)) return 'cpf';
  if (/^[0-9A-Z]{12}\d{2}$/.test(b)) return 'cnpj';
  return null;
}

function dv(valores, pesos) {
  const resto = valores.reduce((a, v, i) => a + v * pesos[i], 0) % 11;
  return resto < 2 ? 0 : 11 - resto;
}

function validar(v) {
  const b = limpar(v);
  const tipo = tipoDocumento(b);
  if (tipo === 'cpf') {
    if (/^(\d)\1{10}$/.test(b)) return false;
    const d = b.split('').map(Number);
    return dv(d.slice(0, 9), PESOS_CPF_1) === d[9] && dv(d.slice(0, 10), PESOS_CPF_2) === d[10];
  }
  if (tipo === 'cnpj') {
    if (/^(\d)\1{13}$/.test(b)) return false;
    // CNPJ alfanumérico (IN RFB 2.229/2024): valor do caractere é ASCII menos 48.
    const val = b.split('').map((c) => c.charCodeAt(0) - 48);
    return dv(val.slice(0, 12), PESOS_CNPJ_1) === val[12] && dv(val.slice(0, 13), PESOS_CNPJ_2) === val[13];
  }
  return false;
}

function formatar(v) {
  const b = limpar(v);
  const tipo = tipoDocumento(b);
  if (tipo === 'cpf') return b.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
  if (tipo === 'cnpj') {
    return b.replace(/^([0-9A-Z]{2})([0-9A-Z]{3})([0-9A-Z]{3})([0-9A-Z]{4})(\d{2})$/, '$1.$2.$3/$4-$5');
  }
  return b;
}

// ---------------------------------------------------------------------------
// Catálogo — espelha src/catalogo.js no que o painel precisa exibir.
// ---------------------------------------------------------------------------
const CERTIDOES = {
  rfb_pgfn:       { nome: 'CND Federal',      aceita: ['cnpj', 'cpf'] },
  cadin_federal:  { nome: 'CADIN Federal',    aceita: ['cnpj', 'cpf'], exigeCertificado: true },
  situacao_fiscal:{ nome: 'Situação Fiscal',  aceita: ['cnpj', 'cpf'], exigeCertificado: true },
  fgts_crf:       { nome: 'CRF do FGTS',      aceita: ['cnpj', 'cpf'] },
  cndt:           { nome: 'CNDT Trabalhista', aceita: ['cnpj', 'cpf'] },
  sefaz_sc:       { nome: 'CND Estadual SC',  aceita: ['cnpj'] },
  municipal:      { nome: 'CND Municipal',    aceita: ['cnpj'], exigeMunicipio: true },
};

const SITUACOES = {
  negativa:                     { rotulo: 'Negativa',        icone: '●', status: 'good' },
  indisponivel:                 { rotulo: 'Indisponível',    icone: '▲', status: 'serious' },
  positiva_com_efeito_negativo: { rotulo: 'Efeito negativa', icone: '●', status: 'good' },
  sem_registro:                 { rotulo: 'Nada consta',     icone: '●', status: 'good' },
  positiva:                     { rotulo: 'Débitos',         icone: '■', status: 'critical' },
  nao_emitida:                  { rotulo: 'Não emitida',     icone: '■', status: 'critical' },
  manual:                       { rotulo: 'Manual',          icone: '▲', status: 'warning' },
  erro:                         { rotulo: 'Falha',           icone: '▲', status: 'serious' },
  nao_aplicavel:                { rotulo: 'n/a',             icone: '–', status: 'neutro' },
};

const PROVEDORES = {
  web: 'Automação própria (grátis)',
  ecac: 'e-CAC com certificado digital',
  mock: 'Simulação — dados de teste',
  infosimples: 'InfoSimples (API paga)',
  serpro: 'SERPRO (API paga)',
};

const descrever = (s) => SITUACOES[s] ?? SITUACOES.erro;

// ---------------------------------------------------------------------------
// Estado e transporte
// ---------------------------------------------------------------------------
const estado = { config: null, competencias: [], atual: null, certificados: null, senhas: {} };
let sondagem = null;

const esc = (v) => String(v ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

async function api(rota, opcoes = {}) {
  const r = await fetch(rota, {
    ...opcoes,
    headers: { 'x-token': TOKEN, 'content-type': 'application/json', ...(opcoes.headers ?? {}) },
  });
  const corpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(corpo.erro ?? `Falha ${r.status}`);
  return corpo;
}

function avisar(mensagem) {
  document.querySelector('.tostada')?.remove();
  const el = document.createElement('div');
  el.className = 'tostada';
  el.setAttribute('role', 'status');
  el.textContent = mensagem;
  document.body.append(el);
  setTimeout(() => el.remove(), 3200);
}

function selo(situacao) {
  const s = descrever(situacao);
  return `<span class="selo selo--${s.status}"><span class="selo__icone" aria-hidden="true">${s.icone}</span>${esc(s.rotulo)}</span>`;
}

function certidoesDe(cliente) {
  return cliente.certidoes ?? estado.config?.certidoes ?? Object.keys(CERTIDOES);
}

// ---------------------------------------------------------------------------
// Gravação — o painel escreve direto no clientes.json que a rotina lê.
// ---------------------------------------------------------------------------
let gravacaoPendente = null;

function gravar({ imediato = false } = {}) {
  clearTimeout(gravacaoPendente);
  const enviar = async () => {
    try {
      await api('/api/clientes', { method: 'POST', body: JSON.stringify(estado.config) });
      document.getElementById('estado-rodada').textContent = 'cadastro salvo';
    } catch (erro) {
      avisar(`Não foi possível gravar: ${erro.message}`);
    }
  };
  // Digitação salva sozinha, mas só depois da pausa: sem isso seria uma
  // gravação por tecla.
  imediato ? enviar() : (gravacaoPendente = setTimeout(enviar, 700));
}

// ---------------------------------------------------------------------------
// Aba: consulta rápida — um documento, resposta na hora, sem cadastrar
// ---------------------------------------------------------------------------
const avulsa = { documento: '', certidoes: null, municipio: '', rodando: false, saida: null };

function renderAvulsa() {
  const alvo = document.getElementById('painel-avulsa');
  const tipo = tipoDocumento(avulsa.documento);
  const valido = Boolean(tipo) && validar(avulsa.documento);
  const escolhidas = avulsa.certidoes ?? Object.keys(CERTIDOES);

  const marcadores = Object.entries(CERTIDOES).map(([id, meta]) => {
    const aplicavel = !tipo || meta.aceita.includes(tipo);
    return `<span class="marcador" role="button" tabindex="0"
      aria-pressed="${escolhidas.includes(id)}" data-avulsa-certidao="${id}"
      style="${aplicavel ? '' : 'opacity:.3;pointer-events:none'}">${esc(meta.nome)}</span>`;
  }).join('');

  const precisaMunicipio = escolhidas.includes('municipal') && tipo === 'cnpj';

  alvo.innerHTML = `
    <section>
      <h2>Consulta rápida</h2>
      <p class="ajuda">Para quando o telefone toca e você só precisa dar uma olhada num CNPJ.
        Não cadastra ninguém e não entra no histórico — é uma pergunta, não um acompanhamento.</p>

      <div class="cartao cartao--ar">
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start">
          <div style="flex:1 1 240px;max-width:320px">
            <input type="text" id="avulsa-doc" value="${esc(avulsa.documento)}"
                   placeholder="CNPJ ou CPF" autocomplete="off"
                   class="${avulsa.documento && !valido ? 'invalido' : ''}">
            ${avulsa.documento && !valido
              ? '<span class="erro-campo">documento inválido</span>'
              : valido ? `<span class="erro-campo" style="color:var(--texto-3)">${esc(formatar(avulsa.documento))}</span>` : ''}
          </div>
          ${precisaMunicipio ? `
          <div style="flex:0 1 200px">
            <input type="text" id="avulsa-municipio" value="${esc(avulsa.municipio)}" placeholder="Município">
          </div>` : ''}
          <button class="principal" id="avulsa-rodar" ${valido && !avulsa.rodando ? '' : 'disabled'}>
            ${avulsa.rodando ? 'Consultando…' : 'Consultar'}
          </button>
        </div>

        <p class="ajuda" style="margin:18px 0 8px">Certidões desta consulta:</p>
        <div class="marcadores">${marcadores}</div>
      </div>
    </section>

    ${avulsa.saida ? secaoResultadoAvulso(avulsa.saida) : ''}`;
}

function secaoResultadoAvulso(saida) {
  if (saida.erro) {
    return `<section><div class="aviso aviso--perigo">
      <span class="aviso__i">▲</span><span>${esc(saida.erro)}</span></div></section>`;
  }

  const linhas = saida.resultados.map((r) => `
    <tr>
      <th scope="row">${esc(r.certidaoNome)}<span class="doc">${esc(r.orgao)}</span></th>
      <td>${selo(r.situacao)}</td>
      <td>${r.validaAte ? `vence ${esc(r.validaAte)}` : '—'}</td>
      <td class="ajuda" style="margin:0;font-size:13px">${esc(r.detalhe).slice(0, 240)}
        ${r.urlManual ? `<a href="${esc(r.urlManual)}" target="_blank" rel="noopener">portal</a>` : ''}</td>
    </tr>`).join('');

  return `
    <section>
      <h2>${esc(saida.documento)}</h2>
      <div class="cartao rolagem">
        <table>
          <thead><tr><th>Certidão</th><th>Situação</th><th>Validade</th><th>O que o órgão respondeu</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
      ${saida.avisos?.length ? `<div class="cartao" style="margin-top:12px">
        <ul class="avisos">${saida.avisos.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}
    </section>`;
}

async function rodarAvulsa() {
  avulsa.rodando = true;
  avulsa.saida = null;
  renderAvulsa();

  try {
    avulsa.saida = await api('/api/avulsa', {
      method: 'POST',
      body: JSON.stringify({
        documento: avulsa.documento,
        certidoes: avulsa.certidoes,
        municipio: avulsa.municipio || null,
        provedor: document.getElementById('provedor').value,
      }),
    });
  } catch (erro) {
    avulsa.saida = { erro: erro.message };
  } finally {
    avulsa.rodando = false;
    renderAvulsa();
  }
}

// ---------------------------------------------------------------------------
// Aba: situação
// ---------------------------------------------------------------------------
function renderSituacao() {
  const alvo = document.getElementById('painel-situacao');
  const dados = estado.atual;

  if (!dados) {
    alvo.innerHTML = `
      <div class="cartao cartao--ar">
        <h2>Nenhuma consulta ainda</h2>
        <p class="ajuda">Cadastre os clientes na aba ao lado e clique em <strong>Consultar agora</strong>.
          Cada rodada grava um relatório em <code>relatorios/</code> e o histórico em <code>historico/</code>.</p>
      </div>`;
    return;
  }

  const r = dados.resumo ?? {};
  const porCliente = new Map();
  for (const item of dados.resultados ?? []) {
    if (!porCliente.has(item.documento)) porCliente.set(item.documento, { nome: item.cliente, itens: new Map() });
    porCliente.get(item.documento).itens.set(item.certidao, item);
  }

  const colunas = Object.keys(CERTIDOES).filter((id) =>
    (dados.resultados ?? []).some((x) => x.certidao === id));

  const linhas = [...porCliente.entries()].map(([doc, c]) => `
      <tr>
        <th scope="row" class="celula-cliente">
          <span class="celula-cliente__nome">${esc(c.nome)}</span>
          <span class="celula-cliente__doc">${esc(formatar(doc))}</span>
        </th>
        ${colunas.map((id) => {
          const item = c.itens.get(id);
          return `<td title="${esc(item?.detalhe ?? '')}">${item ? selo(item.situacao) : selo('nao_aplicavel')}</td>`;
        }).join('')}
      </tr>`).join('');

  // "Regular" é o que voltou verde: negativa, efeito de negativa ou nada consta.
  // Derivar do resumo por subtração erraria sempre que uma situação nova entrasse.
  const regulares = (dados.resultados ?? []).filter((x) => descrever(x.situacao).status === 'good').length;

  alvo.innerHTML = `
    <div class="tiles">
      <div class="tile">
        <div class="tile__valor">${r.clientes ?? 0}</div>
        <div class="tile__rotulo">Clientes monitorados</div>
      </div>
      <div class="tile tile--good">
        <div class="tile__valor">${regulares < 0 ? 0 : regulares}</div>
        <div class="tile__rotulo">Certidões regulares</div>
        <div class="tile__apoio">de ${r.consultas ?? 0} consultas</div>
      </div>
      <div class="tile ${r.clientesComPendencia ? 'tile--critical' : 'tile--good'}">
        <div class="tile__valor">${r.clientesComPendencia ?? 0}</div>
        <div class="tile__rotulo">Clientes com débito ou falha</div>
      </div>
      <div class="tile">
        <div class="tile__valor">${r.manuais ?? 0}</div>
        <div class="tile__rotulo">Conferências manuais</div>
      </div>
    </div>

    <section>
      <h2>Competência ${esc(dados.competencia)}
        <span class="conta">— <a href="/relatorios/${esc(dados.competencia)}.html" target="_blank" rel="noopener">relatório completo</a></span>
      </h2>
      <div class="cartao rolagem">
        <table>
          <thead><tr><th>Cliente</th>${colunas.map((id) => `<th>${esc(CERTIDOES[id].nome)}</th>`).join('')}</tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
      <p class="ajuda" style="margin-top:12px">Passe o mouse sobre uma célula para ver o que o órgão respondeu.</p>
    </section>`;
}

// ---------------------------------------------------------------------------
// Aba: clientes
// ---------------------------------------------------------------------------
function linhaCliente(cliente, i) {
  const tipo = tipoDocumento(cliente.documento);
  const documentoOk = !cliente.documento || validar(cliente.documento);
  const ativas = certidoesDe(cliente);
  const herdado = cliente.certidoes === undefined;
  const faltaMunicipio = ativas.includes('municipal') && !cliente.municipio;

  const marcadores = Object.entries(CERTIDOES)
    .map(([id, meta]) => {
      const aplicavel = !tipo || meta.aceita.includes(tipo);
      const ativo = ativas.includes(id);
      const motivo = !aplicavel
        ? `não se aplica a ${tipo}`
        : herdado
          ? 'herdado da configuração; clique para definir só para este cliente'
          : '';
      return `<span class="marcador${herdado ? ' marcador--herdado' : ''}" role="button" tabindex="0"
        aria-pressed="${ativo}" data-certidao="${id}" data-i="${i}"
        style="${aplicavel ? '' : 'opacity:.3;pointer-events:none'}"
        title="${esc(motivo)}">${esc(meta.nome)}</span>`;
    })
    .join('');

  return `
    <tr>
      <td><input type="text" value="${esc(cliente.nome ?? '')}" data-campo="nome" data-i="${i}" placeholder="Razão social"></td>
      <td class="num">
        <input type="text" class="${documentoOk ? '' : 'invalido'}" value="${esc(cliente.documento ?? '')}"
               data-campo="documento" data-i="${i}" placeholder="CNPJ ou CPF">
        ${documentoOk ? '' : '<span class="erro-campo">dígito verificador inválido</span>'}
      </td>
      <td>
        <input type="text" value="${esc(cliente.municipio ?? '')}" data-campo="municipio" data-i="${i}" placeholder="Município">
        ${faltaMunicipio ? '<span class="erro-campo">exigido pela CND Municipal</span>' : ''}
      </td>
      <td class="num"><input type="text" value="${esc(cliente.dataNascimento ?? '')}" data-campo="dataNascimento" data-i="${i}"
             placeholder="${tipo === 'cpf' ? 'dd/mm/aaaa' : '—'}" ${tipo === 'cnpj' ? 'disabled' : ''}></td>
      <td><div class="marcadores">${marcadores}</div></td>
      <td style="text-align:center"><input type="checkbox" data-campo="ativo" data-i="${i}" ${cliente.ativo === false ? '' : 'checked'}></td>
      <td><button class="icone" data-remover="${i}" title="Remover cliente" aria-label="Remover cliente">✕</button></td>
    </tr>`;
}

function renderClientes() {
  const alvo = document.getElementById('painel-clientes');
  const clientes = estado.config?.clientes ?? [];
  const invalidos = clientes.filter((c) => c.documento && !validar(c.documento)).length;

  alvo.innerHTML = `
    <div class="aviso aviso--perigo">
      <span class="aviso__i" aria-hidden="true">▲</span>
      <span><strong>Este cadastro contém CNPJ e CPF de clientes.</strong>
      O arquivo fica em <code>cnd-monitor/clientes.json</code>, nesta máquina. Se o repositório
      for para o GitHub, mantenha-o privado. O certificado digital A1 nunca entra aqui — veja
      a aba <strong>Certificados</strong>.</span>
    </div>

    <section>
      <h2>Carteira <span class="conta">${clientes.length}</span></h2>
      <p class="ajuda">As alterações são gravadas sozinhas. Clique nas certidões para ligar ou
      desligar cada uma; as que não se aplicam ao tipo de documento ficam esmaecidas. Sem escolha
      própria, o cliente herda a lista da configuração — o primeiro clique passa a valer só para ele.</p>

      <div class="cartao rolagem">
        <table>
          <thead><tr>
            <th style="min-width:200px">Nome</th><th style="min-width:160px">Documento</th>
            <th style="min-width:140px">Município</th><th style="min-width:120px">Nascimento</th>
            <th style="min-width:340px">Certidões</th><th>Ativo</th><th></th>
          </tr></thead>
          <tbody>${clientes.map(linhaCliente).join('') ||
            '<tr><td colspan="7" class="vazio">Nenhum cliente cadastrado.</td></tr>'}</tbody>
        </table>
      </div>

      <div class="acoes">
        <button class="principal" id="acrescentar">Acrescentar cliente</button>
        <button id="importar">Importar de um arquivo</button>
        <input type="file" id="arquivo" accept=".json" hidden>
        <span class="empurra"></span>
        ${invalidos > 0 ? `<span class="erro-campo">${invalidos} documento(s) com dígito inválido</span>` : ''}
      </div>
    </section>`;
}

// ---------------------------------------------------------------------------
// Aba: certificados
// ---------------------------------------------------------------------------
function renderCertificados() {
  const alvo = document.getElementById('painel-certificados');
  const cert = estado.certificados ?? { pasta: null, arquivos: [], erro: null };
  const pasta = estado.config?.certificados?.pastaPadrao ?? '';
  const clientes = estado.config?.clientes ?? [];

  const cartoes = clientes.map((c, i) => {
    const escolhido = c.certificado?.arquivo ?? '';
    const variavel = c.certificado?.senhaVariavel ?? '';
    const senhaOk = variavel ? estado.senhas[variavel] : false;

    const opcoes = ['<option value="">— sem certificado —</option>']
      .concat(cert.arquivos.map((a) =>
        `<option value="${esc(a)}" ${a === escolhido ? 'selected' : ''}>${esc(a)}</option>`))
      .concat(escolhido && !cert.arquivos.includes(escolhido)
        ? [`<option value="${esc(escolhido)}" selected>${esc(escolhido)} (não encontrado)</option>`] : [])
      .join('');

    return `
      <div class="cert">
        <div class="cert__nome">${esc(c.nome || 'sem nome')}</div>
        <div class="cert__doc">${esc(formatar(c.documento ?? ''))}</div>
        <div class="cert__campo">
          <label for="cert-a-${i}">Arquivo .pfx</label>
          <select id="cert-a-${i}" data-cert-arquivo="${i}" style="width:100%">${opcoes}</select>
        </div>
        <div class="cert__campo">
          <label for="cert-v-${i}">Variável com a senha</label>
          <input type="text" id="cert-v-${i}" data-cert-variavel="${i}"
                 value="${esc(variavel)}" placeholder="CERT_NOME_DO_CLIENTE" ${escolhido ? '' : 'disabled'}>
        </div>
        ${
          !escolhido
            ? '<span class="selo selo--neutro"><span class="selo__icone">–</span>não usa e-CAC</span>'
            : !variavel
              ? '<span class="selo selo--warning"><span class="selo__icone">▲</span>falta nomear a variável</span>'
              : senhaOk
                ? '<span class="selo selo--good"><span class="selo__icone">●</span>senha disponível</span>'
                : `<span class="selo selo--critical"><span class="selo__icone">■</span>${esc(variavel)} não está no .env</span>`
        }
      </div>`;
  }).join('');

  const faltando = clientes
    .filter((c) => c.certificado?.senhaVariavel && !estado.senhas[c.certificado.senhaVariavel])
    .map((c) => c.certificado.senhaVariavel);

  alvo.innerHTML = `
    <div class="aviso aviso--calmo">
      <span class="aviso__i" aria-hidden="true">◆</span>
      <span>O <code>.pfx</code> e a senha, juntos, permitem assinar como o cliente. Por isso ficam
      separados: <strong>o arquivo mora fora do repositório</strong>, numa pasta sua, e a
      <strong>senha mora no <code>.env</code></strong>, que o Git ignora. O cadastro guarda apenas
      o nome do arquivo e o nome da variável — nunca a senha.</span>
    </div>

    <section>
      <h2>Pasta dos certificados</h2>
      <div class="cartao cartao--ar">
        <div style="max-width:520px">
          <input type="text" id="pasta-cert" value="${esc(pasta)}" placeholder="~/Certificados">
        </div>
        <p class="ajuda" style="margin:12px 0 0">
          ${cert.dentroDoProjeto
            ? `<span style="color:var(--critical)"><strong>Esta pasta fica dentro do projeto.</strong>
               Um <code>.pfx</code> aqui pode acabar no histórico do Git, e de lá não sai mais.
               Use uma pasta irmã: <code>../Certificados</code>.</span>`
            : cert.erro
              ? `<span style="color:var(--critical)">${esc(cert.erro)}</span>`
              : cert.pasta
                ? `${cert.arquivos.length} certificado(s) em <code>${esc(cert.pasta)}</code>`
                : 'Informe a pasta onde estão os arquivos <code>.pfx</code>. Ela deve ficar fora deste projeto — o padrão <code>../Certificados</code> é a pasta irmã.'}
        </p>
      </div>
    </section>

    ${faltando.length > 0 ? `
    <section>
      <h2>Senhas que faltam <span class="conta">${faltando.length}</span></h2>
      <div class="cartao cartao--ar">
        <p class="ajuda">Acrescente estas linhas ao arquivo <code>cnd-monitor/.env</code> e
          reinicie o painel. Ele é ignorado pelo Git e fica legível só para o seu usuário.</p>
        <pre class="console__saida" style="border:1px solid var(--borda);border-radius:var(--raio);max-height:none">${
          faltando.map((v) => `${esc(v)}=senha-do-certificado`).join('\n')}</pre>
        <div class="acoes"><button id="copiar-env">Copiar</button></div>
      </div>
    </section>` : ''}

    <section>
      <h2>Por cliente</h2>
      <div class="grade-cert">${cartoes || '<p class="vazio">Cadastre clientes primeiro.</p>'}</div>
    </section>`;
}

/**
 * Relê a varredura da pasta e redesenha a aba, devolvendo o cursor.
 *
 * Redesenhar no meio da digitação tiraria o foco do campo a cada letra, então
 * o cursor é reposto onde estava. Espera a gravação assentar: o servidor só
 * consegue varrer a pasta depois que o caminho novo chegou ao clientes.json.
 */
let releituraPendente = null;

function relerCertificados() {
  clearTimeout(releituraPendente);
  releituraPendente = setTimeout(async () => {
    let dados;
    try {
      dados = await api('/api/estado');
    } catch {
      return; // Servidor fora do ar; a próxima tecla tenta de novo.
    }

    estado.certificados = dados.certificados;
    estado.senhas = dados.senhas ?? {};

    const campo = document.getElementById('pasta-cert');
    const focado = document.activeElement === campo;
    const cursor = campo?.selectionStart ?? 0;

    renderCertificados();

    if (focado) {
      const novo = document.getElementById('pasta-cert');
      novo?.focus();
      novo?.setSelectionRange(cursor, cursor);
    }
  }, 900);
}

// ---------------------------------------------------------------------------
// Aba: competências
// ---------------------------------------------------------------------------
function renderCompetencias() {
  const alvo = document.getElementById('painel-competencias');
  const lista = estado.competencias;

  if (lista.length === 0) {
    alvo.innerHTML = `<div class="cartao cartao--ar"><h2>Sem histórico</h2>
      <p class="ajuda">Cada consulta grava um arquivo em <code>historico/</code> e um relatório
      em <code>relatorios/</code>.</p></div>`;
    return;
  }

  alvo.innerHTML = `
    <section>
      <h2>Execuções <span class="conta">${lista.length}</span></h2>
      <div class="cartao rolagem">
        <table>
          <thead><tr><th>Competência</th><th>Clientes</th><th>Consultas</th>
            <th>Com pendência</th><th>Manuais</th><th>Relatório</th></tr></thead>
          <tbody>${lista.map((c) => `
            <tr>
              <td class="num">${esc(c.competencia)}</td>
              <td class="num">${c.resumo?.clientes ?? '—'}</td>
              <td class="num">${c.resumo?.consultas ?? '—'}</td>
              <td class="num">${c.resumo?.clientesComPendencia ?? '—'}</td>
              <td class="num">${c.resumo?.manuais ?? '—'}</td>
              <td><a href="/relatorios/${esc(c.competencia)}.html" target="_blank" rel="noopener">abrir</a></td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
    </section>`;
}

function renderTudo() {
  renderAvulsa();
  renderSituacao();
  renderClientes();
  renderCertificados();
  renderCompetencias();

  // Contar o cadastro inteiro faria a linha dizer 11 enquanto o indicador
  // mostra 10: cliente desmarcado não é consultado.
  const todos = estado.config?.clientes ?? [];
  const ativos = todos.filter((c) => c.ativo !== false).length;
  const inativos = todos.length - ativos;

  const quantos = `${ativos} ${ativos === 1 ? 'cliente ativo' : 'clientes ativos'}` +
    (inativos ? ` · ${inativos} desativado${inativos === 1 ? '' : 's'}` : '');
  const comp = estado.atual?.competencia;

  document.getElementById('linha-fina').textContent = comp
    ? `${quantos} · última consulta em ${comp}`
    : `${quantos} · nenhuma consulta registrada`;
}

// ---------------------------------------------------------------------------
// Rodada
// ---------------------------------------------------------------------------
function renderConsole({ ativa, linhas, codigo }) {
  const caixa = document.getElementById('console');
  caixa.hidden = false;
  const perto = caixa.querySelector('.console__saida');
  const grudado = !perto || perto.scrollTop + perto.clientHeight >= perto.scrollHeight - 40;

  caixa.innerHTML = `
    <div class="console__topo">
      ${ativa ? '<span class="pulso" aria-hidden="true"></span>Consultando' :
        codigo === 0 ? 'Concluída' : `Encerrada com erro (código ${codigo})`}
    </div>
    <pre class="console__saida">${linhas.map(esc).join('\n')}</pre>`;

  if (grudado) {
    const saida = caixa.querySelector('.console__saida');
    saida.scrollTop = saida.scrollHeight;
  }
}

function alternarBotoes(ativa) {
  document.getElementById('rodar').disabled = ativa;
  document.getElementById('parar').hidden = !ativa;
  document.getElementById('estado-rodada').textContent = ativa ? 'em andamento' : '';
}

async function sondar() {
  try {
    const r = await api('/api/rodada');
    renderConsole(r);
    alternarBotoes(r.ativa);

    if (!r.ativa) {
      clearInterval(sondagem);
      sondagem = null;
      await carregar();          // relatório e histórico novos já estão no disco
      avisar(r.codigo === 0 ? 'Consulta concluída.' : 'A consulta terminou com erro — veja o log.');
    }
  } catch {
    clearInterval(sondagem);
    sondagem = null;
    alternarBotoes(false);
  }
}

// ---------------------------------------------------------------------------
// Interação
// ---------------------------------------------------------------------------
document.addEventListener('input', (e) => {
  const alvo = e.target;

  if (alvo.id === 'avulsa-doc') {
    avulsa.documento = alvo.value;
    const cursor = alvo.selectionStart;
    renderAvulsa();
    const novo = document.getElementById('avulsa-doc');
    novo?.focus();
    novo?.setSelectionRange(cursor, cursor);
    return;
  }

  if (alvo.id === 'avulsa-municipio') {
    avulsa.municipio = alvo.value;
    return;
  }

  if (alvo.id === 'pasta-cert') {
    estado.config.certificados = { pastaPadrao: alvo.value };
    gravar();
    // Quem varre a pasta é o servidor: sem reler o estado, você digitaria o
    // caminho certo e continuaria vendo "pasta não encontrada".
    relerCertificados();
    return;
  }

  const iVariavel = alvo.dataset.certVariavel;
  if (iVariavel !== undefined) {
    const cliente = estado.config.clientes[Number(iVariavel)];
    cliente.certificado = { ...(cliente.certificado ?? {}), senhaVariavel: alvo.value.toUpperCase() };
    alvo.value = cliente.certificado.senhaVariavel;
    gravar();
    return;
  }

  const { campo, i } = alvo.dataset;
  if (campo === undefined) return;

  const cliente = estado.config.clientes[Number(i)];
  cliente[campo] = alvo.type === 'checkbox' ? alvo.checked : alvo.value;
  if (campo === 'ativo') cliente.ativo = alvo.checked;
  gravar();

  // Só o documento muda a estrutura da linha (tipo, certidões aplicáveis).
  if (campo === 'documento') {
    const foco = alvo.selectionStart;
    renderClientes();
    const novo = document.querySelector(`[data-campo="documento"][data-i="${i}"]`);
    novo?.focus();
    novo?.setSelectionRange(foco, foco);
  }
});

document.addEventListener('change', async (e) => {
  const iArquivo = e.target.dataset.certArquivo;
  if (iArquivo !== undefined) {
    const cliente = estado.config.clientes[Number(iArquivo)];
    if (e.target.value) {
      const sugestao = `CERT_${(cliente.nome ?? '').normalize('NFD').replace(/\p{Diacritic}/gu, '')
        .toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40)}`;
      cliente.certificado = {
        arquivo: e.target.value,
        senhaVariavel: cliente.certificado?.senhaVariavel || sugestao,
      };
    } else {
      delete cliente.certificado;
    }
    gravar({ imediato: true });
    renderCertificados();
    return;
  }

  if (e.target.id === 'arquivo' && e.target.files?.[0]) {
    try {
      const lido = JSON.parse(await e.target.files[0].text());
      estado.config = { ...lido, clientes: lido.clientes ?? [] };
      gravar({ imediato: true });
      renderTudo();
      avisar('Cadastro importado e gravado.');
    } catch (erro) {
      avisar(`Arquivo inválido: ${erro.message}`);
    }
  }
});

document.addEventListener('click', async (e) => {
  const marcadorAvulso = e.target.closest('[data-avulsa-certidao]');
  if (marcadorAvulso) {
    const atuais = new Set(avulsa.certidoes ?? Object.keys(CERTIDOES));
    const id = marcadorAvulso.dataset.avulsaCertidao;
    atuais.has(id) ? atuais.delete(id) : atuais.add(id);
    avulsa.certidoes = [...atuais];
    renderAvulsa();
    return;
  }

  if (e.target.id === 'avulsa-rodar') {
    await rodarAvulsa();
    return;
  }

  const marcador = e.target.closest('[data-certidao]');
  if (marcador) {
    const cliente = estado.config.clientes[Number(marcador.dataset.i)];
    const atuais = new Set(certidoesDe(cliente));
    const id = marcador.dataset.certidao;
    atuais.has(id) ? atuais.delete(id) : atuais.add(id);
    cliente.certidoes = [...atuais];
    gravar({ imediato: true });
    renderClientes();
    return;
  }

  const remover = e.target.closest('[data-remover]');
  if (remover) {
    const i = Number(remover.dataset.remover);
    const cliente = estado.config.clientes[i];
    if (confirm(`Remover ${cliente.nome || 'este cliente'} do monitoramento?`)) {
      estado.config.clientes.splice(i, 1);
      gravar({ imediato: true });
      renderTudo();
    }
    return;
  }

  if (e.target.id === 'acrescentar') {
    estado.config.clientes.push({ nome: '', documento: '', certidoes: Object.keys(CERTIDOES) });
    gravar({ imediato: true });
    renderClientes();
    document.querySelector('#painel-clientes tbody tr:last-child input')?.focus();
    return;
  }

  if (e.target.id === 'importar') { document.getElementById('arquivo').click(); return; }

  if (e.target.id === 'copiar-env') {
    const texto = e.target.closest('section').querySelector('pre').textContent;
    navigator.clipboard?.writeText(texto).then(
      () => avisar('Linhas copiadas — cole no arquivo .env.'),
      () => avisar('Não foi possível copiar; selecione o texto à mão.'),
    );
    return;
  }

  if (e.target.id === 'rodar') {
    // Rodar com a carteira vazia gravava um cadastro vazio e falhava logo
    // depois. O erro chegava do processo filho, sem dizer o que fazer.
    const ativos = (estado.config.clientes ?? []).filter((c) => c.ativo !== false).length;
    if (ativos === 0) {
      avisar('Nenhum cliente ativo na carteira. Use a Consulta rápida, ou cadastre em Clientes.');
      return;
    }

    const provedor = document.getElementById('provedor').value;
    estado.config.provedorPadrao = provedor;
    try {
      await api('/api/clientes', { method: 'POST', body: JSON.stringify(estado.config) });
      await api('/api/rodada', { method: 'POST', body: JSON.stringify({ provedor }) });
      alternarBotoes(true);
      sondagem ??= setInterval(sondar, 900);
    } catch (erro) {
      avisar(erro.message);
    }
    return;
  }

  if (e.target.id === 'parar') {
    await api('/api/rodada/parar', { method: 'POST' }).catch(() => {});
    return;
  }

  const aba = e.target.closest('.aba');
  if (aba) {
    for (const outra of document.querySelectorAll('.aba')) {
      const ativa = outra === aba;
      outra.setAttribute('aria-selected', String(ativa));
      document.getElementById(`painel-${outra.dataset.painel}`).hidden = !ativa;
    }
  }
});

document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset?.certidao) {
    e.preventDefault();
    e.target.click();
  }
});

// ---------------------------------------------------------------------------
// Carga
// ---------------------------------------------------------------------------
async function carregar() {
  const dados = await api('/api/estado');
  estado.config = dados.config;
  estado.config.clientes ??= [];
  estado.competencias = dados.competencias;
  estado.atual = dados.atual;
  estado.certificados = dados.certificados;
  estado.senhas = dados.senhas ?? {};

  const seletor = document.getElementById('provedor');
  seletor.innerHTML = Object.entries(PROVEDORES)
    .map(([id, rotulo]) =>
      `<option value="${id}" ${id === estado.config.provedorPadrao ? 'selected' : ''}>${esc(rotulo)}</option>`)
    .join('');

  renderTudo();
}

async function iniciar() {
  try {
    await carregar();
  } catch (erro) {
    document.getElementById('linha-fina').textContent =
      `Não foi possível falar com o servidor local: ${erro.message}`;
    return;
  }

  // Uma rodada iniciada antes de recarregar a página continua rodando.
  const r = await api('/api/rodada').catch(() => null);
  if (r?.ativa) {
    renderConsole(r);
    alternarBotoes(true);
    sondagem = setInterval(sondar, 900);
  }
}

iniciar();
</script>
</body>
</html>

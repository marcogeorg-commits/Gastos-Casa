name: Monitor de certidões (mensal)

on:
  schedule:
    # Dia 1º de cada mês, 08:00 no horário de Brasília (11:00 UTC).
    - cron: '0 11 1 * *'
  workflow_dispatch:
    inputs:
      competencia:
        description: 'Competência AAAA-MM (vazio = mês corrente)'
        required: false
      provedor:
        description: 'Provedor padrão (mock | infosimples | serpro)'
        required: false

permissions:
  contents: write

concurrency:
  group: cnd-mensal
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnd-monitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testes
        run: npm test

      # Só faz sentido para o provedor gratuito "web". Defina a variável de
      # repositório CND_PROVEDOR=web para ativá-lo. Atenção: portais públicos
      # às vezes bloqueiam IPs de datacenter — se isso acontecer, rode o "web"
      # localmente e deixe o agendamento para um provedor de API.
      - name: Navegador para automação própria
        if: vars.CND_PROVEDOR == 'web'
        run: npm install playwright && npx playwright install --with-deps chromium

      - name: Consultar certidões
        env:
          INFOSIMPLES_TOKEN: ${{ secrets.INFOSIMPLES_TOKEN }}
          INFOSIMPLES_ENDPOINTS: ${{ secrets.INFOSIMPLES_ENDPOINTS }}
          SERPRO_CONSUMER_KEY: ${{ secrets.SERPRO_CONSUMER_KEY }}
          SERPRO_CONSUMER_SECRET: ${{ secrets.SERPRO_CONSUMER_SECRET }}
          COMPETENCIA: ${{ inputs.competencia }}
          PROVEDOR: ${{ inputs.provedor || vars.CND_PROVEDOR }}
        run: |
          args=()
          if [ -n "$COMPETENCIA" ]; then args+=(--competencia "$COMPETENCIA"); fi
          if [ -n "$PROVEDOR" ]; then args+=(--provedor "$PROVEDOR"); fi
          node src/index.js "${args[@]}"

      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-certidoes
          path: |
            cnd-monitor/relatorios/
            cnd-monitor/historico/
          retention-days: 90

      - name: Versionar relatório e histórico
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add relatorios historico
          if git diff --staged --quiet; then
            echo 'Nada mudou nesta competência.'
          else
            git commit -m "Certidões: competência $(date -u +%Y-%m)"
            git push origin HEAD:${{ github.ref_name }}
          fi
